<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="vw-data.js"></script>
<style>body{margin:0;background:#0E0F12;color:#E8E4DA;font-family:'Alegreya Sans',sans-serif;-webkit-font-smoothing:antialiased}a{color:#E8C25A;text-decoration:none}a:hover{color:#FFE7C2}*{box-sizing:border-box}input::placeholder{color:#9A9DA8}</style>
</helmet>
<div style="padding:56px 80px 120px;display:flex;flex-direction:column;gap:32px">
  <dc-import name="VwNav" variant="pages" active="search" lang="{{ lang }}" hint-size="100%,36px"></dc-import>
  <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;gap:60px;align-items:flex-start;width:max-content">

    <div data-screen-label="Szukaj desktop" style="flex-shrink:0;width:1440px;min-height:1000px;background:#14161B;outline:1px solid #3A3F4C">
      <dc-import name="VwNav" variant="desktop" active="search" lang="{{ lang }}" on-lang="{{ setLang }}" hint-size="1440px,72px"></dc-import>
      <div style="padding:48px 120px 0;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;height:66px;max-width:860px;background:#1B1D23;border:1px solid #7A6438;box-shadow:inset 0 2px 6px rgba(0,0,0,.5),0 0 0 1px #14161B">
          <input value="{{ q }}" onChange="{{ onQ }}" placeholder="{{ t.ph }}" style="flex:1;background:transparent;border:0;outline:0;color:#E8E4DA;font-family:'Alegreya Sans',sans-serif;font-size:22px;padding:0 22px">
          <div style="background:linear-gradient(#E8C25A,#C9A45C);color:#14161B;font-weight:800;font-size:16px;letter-spacing:.08em;padding:0 30px;display:flex;align-items:center">{{ t.btn }}</div>
        </div>
        <div style="display:flex;gap:4px;border-bottom:1px solid #3A3F4C">
          <sc-for list="{{ tabs }}" as="b" hint-placeholder-count="5">
            <sc-if value="{{ b.on }}"><div style="display:flex;gap:8px;align-items:center;padding:12px 16px;font-size:16px;font-weight:800;color:#E8E4DA;border-bottom:2px solid #E8C25A;margin-bottom:-1px">{{ b.n }}<span style="font-size:13px;color:#14161B;background:#E8C25A;padding:0 6px">{{ b.c }}</span></div></sc-if>
            <sc-if value="{{ b.off }}"><div onClick="{{ b.set }}" style="display:flex;gap:8px;align-items:center;padding:12px 16px;font-size:16px;font-weight:700;color:#9A9DA8;cursor:pointer">{{ b.n }}<span style="font-size:13px;color:#C9CED6;background:#252832;padding:0 6px">{{ b.c }}</span></div></sc-if>
          </sc-for>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;padding:28px 120px 88px;align-items:start">
        <div style="display:flex;flex-direction:column">
          <span style="font-size:15px;color:#9A9DA8;margin-bottom:8px">{{ summary }}</span>
          <sc-for list="{{ res }}" as="r" hint-placeholder-count="6">
            <a href="{{ r.href }}" style="display:flex;gap:16px;padding:18px 0;border-bottom:1px solid #252832;color:#E8E4DA">
              <div style="width:48px;height:48px;flex-shrink:0;border:1px solid {{ r.c }};background:repeating-linear-gradient(135deg,#14161B 0 5px,#1B1D23 5px 10px)"></div>
              <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
                <div style="display:flex;gap:10px;align-items:center"><span style="font-size:12px;font-weight:800;letter-spacing:.14em;color:{{ r.bc }};border:1px solid {{ r.bc }};padding:1px 6px">{{ r.badge }}</span><span style="font-size:15px;color:#9A9DA8">{{ r.meta }}</span></div>
                <span style="font-size:22px;font-weight:800;color:{{ r.c }}">{{ r.a }}<span style="background:rgba(232,194,90,.22);box-shadow:inset 0 -2px 0 #E8C25A">{{ r.m }}</span>{{ r.b }}</span>
                <span style="font-size:16px;color:#C9CED6;line-height:1.4">{{ r.snip }}</span>
              </div>
            </a>
          </sc-for>
          <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:48px 0;display:flex;flex-direction:column;gap:12px"><span style="font-family:'Grenze Gotisch',serif;font-size:36px;color:#E8C25A">{{ emptyT }}</span><span style="font-size:18px;color:#9A9DA8">{{ t.emptyD }}</span></div>
          </sc-if>
        </div>
        <sc-if value="{{ hasBest }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:10px">
            <span style="font-size:13px;font-weight:800;letter-spacing:.18em;color:#C9A45C">{{ t.best }}</span>
            <dc-import name="VwTooltip" item="{{ best }}" lang="{{ lang }}" hint-size="380px,380px"></dc-import>
          </div>
        </sc-if>
      </div>
    </div>

    <div data-screen-label="Szukaj mobile" style="flex-shrink:0;width:390px;background:#14161B;outline:1px solid #3A3F4C;border-radius:28px;overflow:hidden">
      <dc-import name="VwNav" variant="mobile" lang="{{ lang }}" on-lang="{{ setLang }}" hint-size="390px,60px"></dc-import>
      <div style="padding:18px 16px 0;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;height:52px;background:#1B1D23;border:1px solid #7A6438"><input value="{{ q }}" onChange="{{ onQ }}" placeholder="{{ t.ph }}" style="flex:1;background:transparent;border:0;outline:0;color:#E8E4DA;font-family:'Alegreya Sans',sans-serif;font-size:18px;padding:0 14px"></div>
        <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px">
          <sc-for list="{{ tabs }}" as="b" hint-placeholder-count="5">
            <sc-if value="{{ b.on }}"><span style="flex-shrink:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;font-size:15px;font-weight:800;background:#E8C25A;color:#14161B">{{ b.n }} {{ b.c }}</span></sc-if>
            <sc-if value="{{ b.off }}"><span onClick="{{ b.set }}" style="flex-shrink:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;font-size:15px;font-weight:700;border:1px solid #3A3F4C;background:#1B1D23;color:#C9CED6;cursor:pointer">{{ b.n }} {{ b.c }}</span></sc-if>
          </sc-for>
        </div>
      </div>
      <div style="padding:6px 16px 28px;display:flex;flex-direction:column">
        <sc-for list="{{ res }}" as="r" hint-placeholder-count="6">
          <a href="{{ r.href }}" style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #252832;color:#E8E4DA">
            <div style="width:40px;height:40px;flex-shrink:0;border:1px solid {{ r.c }};background:repeating-linear-gradient(135deg,#14161B 0 5px,#1B1D23 5px 10px)"></div>
            <div style="display:flex;flex-direction:column;gap:3px;min-width:0">
              <span style="font-size:11px;font-weight:800;letter-spacing:.14em;color:{{ r.bc }}">{{ r.badge }}</span>
              <span style="font-size:18px;font-weight:800;color:{{ r.c }};line-height:1.15">{{ r.a }}<span style="background:rgba(232,194,90,.22);box-shadow:inset 0 -2px 0 #E8C25A">{{ r.m }}</span>{{ r.b }}</span>
              <span style="font-size:14px;color:#9A9DA8">{{ r.meta }}</span>
            </div>
          </a>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:32px 0;display:flex;flex-direction:column;gap:8px"><span style="font-family:'Grenze Gotisch',serif;font-size:28px;color:#E8C25A">{{ emptyT }}</span><span style="font-size:16px;color:#9A9DA8">{{ t.emptyD }}</span></div></sc-if>
      </div>
      <dc-import name="VwNav" variant="tabs" active="search" lang="{{ lang }}" hint-size="390px,68px"></dc-import>
    </div>
  </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = {
  pl: { dq: 'popiel', ph: 'Szukaj przedmiotu, potwora, krainy…', btn: 'SZUKAJ', best: 'NAJLEPSZE DOPASOWANIE', lv: 'Poz. ', emptyD: 'Sprawdź pisownię albo szukaj krótszej frazy, np. samego rdzenia słowa.',
    tabs: { all: 'Wszystko', item: 'Przedmioty', monster: 'Potwory', zone: 'Krainy', guide: 'Poradniki' }, badge: { item: 'PRZEDMIOT', monster: 'POTWÓR', zone: 'KRAINA', guide: 'PORADNIK' },
    summary: (n, q) => n + ' ' + (n === 1 ? 'wynik' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'wyniki' : 'wyników') + ' dla „' + q + '”', emptyT: q => 'Nic dla „' + q + '”',
    guides: [['Popielne Ziemie: przewodnik dla nowych', 'Od Osady Wrzosowisko do Popielnego Traktu, pierwsze 30 poziomów.'], ['Ulepszanie od +0 do +9', 'Kiedy używać Pieczęci Ochrony i dlaczego +8 to próg ryzyka.'], ['Popielny Kamień: gdzie farmić', 'Najlepsze miejsca i potwory, z których wypada materiał do ulepszania.']] },
  en: { dq: 'ash', ph: 'Search items, monsters, zones…', btn: 'SEARCH', best: 'TOP MATCH', lv: 'Lv. ', emptyD: 'Check the spelling or try a shorter phrase, such as the root of the word.',
    tabs: { all: 'All', item: 'Items', monster: 'Monsters', zone: 'Zones', guide: 'Guides' }, badge: { item: 'ITEM', monster: 'MONSTER', zone: 'ZONE', guide: 'GUIDE' },
    summary: (n, q) => n + ' ' + (n === 1 ? 'result' : 'results') + ' for “' + q + '”', emptyT: q => 'Nothing for “' + q + '”',
    guides: [['The Ashlands: new player guide', 'From Heathmoor to the Ash Road, the first 30 levels.'], ['Upgrading from +0 to +9', 'When to use Seals of Protection and why +8 is the risk threshold.'], ['Ash Stone: where to farm', 'The best spots and monsters that drop the upgrade material.']] }
};
const BC = { item: '#E8C25A', monster: '#D64A3E', zone: '#4FD16B', guide: '#4A8FE7' };
class Component extends DCLogic {
  state = { lang: null, q: null, tab: 'all' };
  componentDidMount() {
    try { const l = localStorage.getItem('vw-lang'); if (l === 'pl' || l === 'en') this.setState({ lang: l }); } catch (e) {}
    if (!window.VW) this._i = setInterval(() => { if (window.VW) { clearInterval(this._i); this.forceUpdate(); } }, 40);
  }
  componentWillUnmount() { clearInterval(this._i); }
  renderVals() {
    const lang = this.state.lang || 'pl', L = lang === 'en', t = T[lang];
    const setLang = l => { this.setState({ lang: l, q: null }); try { localStorage.setItem('vw-lang', l); } catch (e) {} };
    const V = window.VW;
    if (!V) return { ready: false, lang, setLang, t };
    const q = this.state.q ?? t.dq, ql = q.trim().toLowerCase(), tab = this.state.tab;
    const idx = [].concat(
      V.items.map(i => { const r = V.rar[i.rar]; return { type: 'item', id: i.id, title: L ? i.en : i.pl, c: r.c, meta: (L ? r.en : r.pl) + ' · ' + (L ? i.ten : i.tpl) + ' · ' + t.lv + i.lvl, snip: i.b.length ? i.b.map(x => (L ? x[1] : x[0])).join(' · ') : (i.f ? (L ? i.f[1] : i.f[0]) : ''), href: V.itemHref(i.id) }; }),
      V.monsters.map(m => { const z = V.zone(m.zone); return { type: 'monster', title: L ? m.en : m.pl, c: '#E8E4DA', meta: V.loc(V.ranks[m.rank], lang) + ' · ' + V.loc(V.kinds[m.kind], lang) + ' · ' + t.lv + m.lvl, snip: (L ? z.en : z.pl) + ' · ' + m.resp, href: m.id === 'straznik' ? V.href('monster') : '#' }; }),
      V.zones.map(z => { const ty = V.zoneTypes[z.z]; return { type: 'zone', title: L ? z.en : z.pl, c: '#E8E4DA', meta: V.loc(ty, lang) + ' · ' + t.lv + z.lv, snip: L ? ty.den : ty.dpl, href: z.id === 'kurhany' ? V.href('zone') : '#' }; }),
      t.guides.map(([g, s]) => ({ type: 'guide', title: g, c: '#E8E4DA', meta: 'Wiki', snip: s, href: '#' }))
    );
    const hits = ql ? idx.filter(r => r.title.toLowerCase().includes(ql) || r.snip.toLowerCase().includes(ql)) : [];
    hits.sort((a, b) => (b.title.toLowerCase().includes(ql) ? 1 : 0) - (a.title.toLowerCase().includes(ql) ? 1 : 0));
    const cnt = k => (k === 'all' ? hits.length : hits.filter(r => r.type === k).length);
    const shown = tab === 'all' ? hits : hits.filter(r => r.type === tab);
    const bestItem = hits.find(r => r.type === 'item');
    return {
      ready: true, lang, setLang, t, q,
      onQ: e => this.setState({ q: e.target.value }),
      tabs: ['all', 'item', 'monster', 'zone', 'guide'].map(k => ({ n: t.tabs[k], c: cnt(k), on: k === tab, off: k !== tab, set: () => this.setState({ tab: k }) })),
      summary: t.summary(shown.length, q.trim()), empty: shown.length === 0, emptyT: t.emptyT(q.trim()),
      res: shown.map(r => { const i = r.title.toLowerCase().indexOf(ql), n = ql.length; return { ...r, bc: BC[r.type], badge: t.badge[r.type], a: i >= 0 ? r.title.slice(0, i) : r.title, m: i >= 0 ? r.title.slice(i, i + n) : '', b: i >= 0 ? r.title.slice(i + n) : '' }; }),
      hasBest: !!bestItem, best: bestItem ? bestItem.id : 'ostrze'
    };
  }
}
</script>
</body>
</html>
